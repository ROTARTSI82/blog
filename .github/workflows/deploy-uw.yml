name: deploy-uw.yml
on:
  push:
    branches:
      - master

jobs:
  deployuw:
    name: deployuw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - run: git lfs checkout
      - uses: actions/setup-node@v5
        with:
          node-version: latest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun -v
      - run: node -v
      - name: Install TeX dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-pictures texlive-science dvisvgm
      - name: Cache TikZ SVGs
        uses: actions/cache@v4
        with:
          path: .tikz-cache
          key: ${{ runner.os }}-tikz-${{ hashFiles('src/markdown/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-tikz-
      - run: bun install
      - run: bun run build
      - run: mkdir ~/.ssh
      - run: ssh-keyscan granty29.vergil.u.washington.edu >> ~/.ssh/known_hosts
      - run: echo "${{ secrets.PUB_DEPLOY_KEY }}" > ~/.ssh/id_rsa.pub
      - run: touch ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa && echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
      - run: rsync -aimPz public_html/ granty29@granty29.vergil.u.washington.edu:~/public_html/
      - run: rm -rf ~/.ssh
        if: always()
